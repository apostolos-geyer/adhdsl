<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>adhdsl perf bench</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        margin: 1.5rem;
        background: #0e0e10;
        color: #e8e8ea;
      }
      h1 {
        margin-top: 0;
        font-weight: 500;
      }
      .controls {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        font-weight: 500;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      input {
        background: #1c1c1f;
        color: #e8e8ea;
        border: 1px solid #333;
        padding: 0.4rem 0.6rem;
        border-radius: 4px;
        width: 4rem;
      }
      label {
        font-size: 0.9rem;
        color: #a8a8b0;
      }
      #status {
        font-size: 0.85rem;
        color: #a8a8b0;
        margin-bottom: 1rem;
        font-family: ui-monospace, monospace;
        min-height: 1.2em;
      }
      #host {
        position: absolute;
        left: -10000px;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
      table {
        border-collapse: collapse;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
      }
      th,
      td {
        padding: 0.4rem 0.75rem;
        text-align: right;
        border-bottom: 1px solid #1c1c1f;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      thead th {
        color: #a8a8b0;
        font-weight: 500;
        border-bottom: 1px solid #333;
      }
      .ratio {
        color: #6b6b75;
        font-size: 0.75rem;
      }
      td.good { color: #4ade80; }
      td.ok { color: #fbbf24; }
      td.bad { color: #f87171; }
    </style>
  </head>
  <body>
    <h1>adhdsl perf bench</h1>
    <p style="color: #a8a8b0; max-width: 60ch">
      Compares <strong>vanilla DOM</strong>, <strong>adhdsl</strong>,
      <strong>lit-html</strong>, and <strong>solid-js</strong> on the standard
      js-framework-benchmark scenarios. Each scenario is run a few times per
      framework and the median is reported. Ratios are relative to vanilla.
    </p>
    <div class="controls">
      <label>iterations <input id="iterations" type="number" value="5" min="1" max="20" /></label>
      <button id="run">run benchmarks</button>
    </div>
    <div id="status"></div>
    <div id="results"></div>
    <div id="host"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
